<g font-size="8.5" fill="#333">
<text x="52" y="78">PK id uuid</text><text x="52" y="92">UQ email text</text><text x="52" y="106">password_hash text</text><text x="52" y="120">role text (station|logistics|admin)</text><text x="52" y="134">created_at timestamptz</text>
<text x="432" y="78">PK id uuid</text><text x="432" y="92">UQ code text</text><text x="432" y="106">name text</text><text x="432" y="120">geom geometry(Point,4326)</text><text x="432" y="134">next_resupply_date date</text>
<text x="812" y="78">PK id uuid</text><text x="812" y="92">route text[]</text><text x="812" y="106">depart/arrive date</text><text x="812" y="120">status text</text><text x="812" y="134">capacity_kg/m3 numeric, delay_days int</text>
<text x="1192" y="78">PK id uuid</text><text x="1192" y="92">UQ serial text</text><text x="1192" y="106">name text</text><text x="1192" y="120">FK station_id -&gt; stations</text><text x="1192" y="134">maintenance_due bool, next_maintenance date</text>
<text x="52" y="278">PK id uuid</text><text x="52" y="292">full_name text, role_title text</text><text x="52" y="306">FK station_id -&gt; stations</text><text x="52" y="320">status (active|in_transit|emergency)</text><text x="52" y="334">last_location text, last_update ts, clearance date</text>
<text x="432" y="278">PK id uuid</text><text x="432" y="292">FK voyage_id -&gt; voyages</text><text x="432" y="306">FK personnel_id -&gt; personnel</text><text x="432" y="320">role_on_board text</text><text x="432" y="334">UQ (voyage_id, personnel_id)</text>
<text x="812" y="278">PK id uuid</text><text x="812" y="292">name, category, box_label text</text><text x="812" y="306">weight_kg/volume_m3 numeric, priority int</text><text x="812" y="320">quantity numeric</text><text x="812" y="334">FK station_id, voyage_id, asset_id</text>
<text x="1192" y="278">PK id uuid</text><text x="1192" y="292">FK station_id -&gt; stations</text><text x="1192" y="306">FK raised_by -&gt; users</text><text x="1192" y="320">raised_at timestamptz</text><text x="1192" y="334">state text, payload jsonb</text>
<text x="52" y="478">PK id uuid</text><text x="52" y="492">FK cargo_item_id -&gt; cargo_items</text><text x="52" y="506">FK voyage_id -&gt; voyages, FK created_by -&gt; users</text><text x="52" y="520">requested_qty numeric &gt; 0</text><text x="52" y="534">status (requested|cleared|shipped|received|rejected)</text><text x="52" y="548">qr_token, stow_position text, created/updated ts</text>
<text x="432" y="478">PK id uuid</text><text x="432" y="492">FK cargo_item_id -&gt; cargo_items</text><text x="432" y="506">quantity numeric &gt; 0</text><text x="432" y="520">FK consumed_by -&gt; users</text><text x="432" y="534">consumed_at timestamptz, notes text</text>
<text x="812" y="478">PK id bigserial</text><text x="812" y="492">ts timestamptz, user_id uuid</text><text x="812" y="506">action, entity text, entity_id uuid</text><text x="812" y="520">details jsonb</text><text x="812" y="534">prev_hash, row_hash text (sha256 chain)</text><text x="812" y="548">TRIGGER blocks UPDATE/DELETE</text>
<text x="1192" y="478">PK client_uuid uuid</text><text x="1192" y="492">applied_at timestamptz</text><text x="1192" y="506">(idempotency receipts for /sync/batch)</text>
</g>
